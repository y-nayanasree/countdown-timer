
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="countdown-container">
        <p class="tagline">TIME IS PRECIOUS</p>

        <h1>Countdown Timer</h1>
        <p class="subtitle">Every second brings us closer to the moment!</p>

        <section class="timer-card">
            <h2>Time Remaining</h2>

            <div class="countdown" id="countdown">
                <div class="time-box">
                    <span id="days">00</span>
                    <p>Days</p>
                </div>

                <div class="time-box">
                    <span id="hours">00</span>
                    <p>Hours</p>
                </div>

                <div class="time-box">
                    <span id="minutes">00</span>
                    <p>Minutes</p>
                </div>

                <div class="time-box">
                    <span id="seconds">00</span>
                    <p>Seconds</p>
                </div>
            </div>

            <p id="message" class="message" aria-live="polite">
                Counting down to your special moment!
            </p>
        </section>

        <p class="note">
            The countdown updates automatically every second.
        </p>
    </main>

    <footer>
        <p>Designed with HTML, CSS & JavaScript 💜</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
